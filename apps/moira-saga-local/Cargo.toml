[package]
name = "moira-saga-local"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
license = "MIT OR Apache-2.0"
description = "Sovereign durable local owner for Moira's closed saga service"

[dependencies]
aegis-client = { path = "../../../aegis/crates/aegis-client" }
aegis-local-client = { path = "../../../aegis/crates/aegis-local-client" }
aegis-protocol = { path = "../../../aegis/crates/aegis-protocol" }
aegis-wire = { path = "../../../aegis/crates/aegis-wire" }
moira-core = { path = "../.." }
moira-aegis = { path = "../../adapters/moira-aegis" }
moira-local-daemon = { path = "../../crates/moira-local-daemon" }
moira-protocol = { path = "../../crates/moira-protocol" }
moira-service = { path = "../../crates/moira-service" }
moira-sqlite = { path = "../../adapters/moira-sqlite" }
moira-unix-peer = { path = "../../adapters/moira-unix-peer" }
moira-wire = { path = "../../crates/moira-wire" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
signal-hook = "0.3"

[dev-dependencies]
moira-client = { path = "../../crates/moira-client", features = ["unix"] }
nix = { version = "=0.29.0", features = ["process", "signal", "user"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
