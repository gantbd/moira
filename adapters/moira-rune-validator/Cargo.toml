[package]
name = "moira-rune-validator"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
license = "MIT OR Apache-2.0"
description = "Bounded Rune theorem-prover adapter for Moira deliberation"

[dependencies]
moira-host = { path = "../../crates/moira-host" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[dev-dependencies]
moira-core = { path = "../.." }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
