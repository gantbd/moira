[package]
name = "moira-agora"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
license = "MIT OR Apache-2.0"
description = "Public-client Agora response-publication adapter for Moira"

[dependencies]
agora-actor-publication-port = { path = "../../../agora/ports/agora-actor-publication-port" }
agora-client = { path = "../../../agora/client/agora-client" }
agora-protocol = { path = "../../../agora/protocol/agora-protocol" }
moira-core = { path = "../.." }
moira-host = { path = "../../crates/moira-host" }
moira-protocol = { path = "../../crates/moira-protocol" }

[dev-dependencies]
agora-engine = { path = "../../../agora/engine/agora-engine" }
agora-service = { path = "../../../agora/service/agora-service" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
