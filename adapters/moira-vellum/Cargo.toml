[package]
name = "moira-vellum"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
license = "MIT OR Apache-2.0"
description = "Durable public-client Vellum edit adapter for Moira"

[dependencies]
moira-protocol = { path = "../../crates/moira-protocol" }
vellum-client = { path = "../../../vellum/client/vellum-client" }
vellum-protocol = { path = "../../../vellum/protocol/vellum-protocol" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
