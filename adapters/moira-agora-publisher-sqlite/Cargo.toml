[package]
name = "moira-agora-publisher-sqlite"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
license = "MIT OR Apache-2.0"
description = "SQLite owner for Moira's Agora publisher replay checkpoint"

[dependencies]
agora-client = { path = "../../../agora/client/agora-client" }
agora-protocol = { path = "../../../agora/protocol/agora-protocol" }
moira-agora = { path = "../moira-agora" }
moira-protocol = { path = "../../crates/moira-protocol" }
moira-sqlite = { path = "../moira-sqlite" }
rusqlite = { version = "=0.41.1", features = ["bundled", "limits"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
