name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out Moira
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: moira
          persist-credentials: false
      - name: Check out Keystone dependency
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { repository: gantbd/keystone, ref: 2e4faf10ec0a70805aa1db1555f93c77fcf0a1e4, path: keystone, persist-credentials: false }
      - name: Check out Aegis dependency
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { repository: gantbd/aegis, ref: b272106cf6d0093839a7d696c829bf8a408b0306, path: aegis, persist-credentials: false }
      - name: Check out Agora dependency
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { repository: gantbd/agora, ref: a86a8a6eba54a5191c245f87f3664f026403f051, path: agora, persist-credentials: false }
      - name: Check out Chronos dependency
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { repository: gantbd/chronos, ref: ebff27188388cd0249d07751b1cc848c6ef1a3f9, path: chronos, persist-credentials: false }
      - name: Check out Daimon dependency
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { repository: gantbd/daimon, ref: 325e662a6a945cf8a064b9812ebbbdac02be4130, path: daimon, persist-credentials: false }
      - name: Check out Hermes dependency
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { repository: gantbd/hermes, ref: 3f60c1c7b00b1a61230508b11422ddfc84b61856, path: hermes, persist-credentials: false }
      - name: Check out Vellum dependency
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { repository: gantbd/vellum, ref: a59d8a343145b31ff5288499903fb002a1b61a84, path: vellum, persist-credentials: false }
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component clippy,rustfmt
      - name: Audit current RustSec advisories
        working-directory: moira
        run: |
          cargo install cargo-audit --version 0.23.0 --locked
          cargo audit --deny warnings
      - name: Verify workspace
        working-directory: moira
        run: make check
      - name: Verify isolated peer profiles
        working-directory: moira
        run: make check-peer-profiles

